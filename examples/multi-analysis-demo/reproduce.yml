# Multi-analysis workflow. Copy to .github/workflows/reproduce.yml at the repo root.
# One fresh runner discovers every analysis, reproduces each package, and builds
# the combined site from those regenerated results.
name: reproduce

on:
  push:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  reproduce-and-build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
      - name: Reproduce every analysis
        run: |
          set -euo pipefail
          for manifest in analyses/*/whatran.json; do
            analysis="${manifest%/whatran.json}"
            slug="${analysis##*/}"
            (
              cd "$analysis"
              mv results "$RUNNER_TEMP/$slug-reference-outputs"
              bash run.sh
              python3 check.py results "$RUNNER_TEMP/$slug-reference-outputs"
            )
          done
      - name: Build the combined site
        run: python3 build_index.py
      - name: Configure GitHub Pages
        uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v4
        with:
          path: site

  deploy-pages:
    needs: reproduce-and-build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
