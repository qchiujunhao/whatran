name: test

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: r-lib/actions/setup-r@v2
        with:
          r-version: "release"

      - name: Unit tests (comparator, recorder, hooks, API, R shim)
        run: python3 -m unittest discover -v

      - name: The package installs and the command runs
        run: |
          python3 -m pip install --quiet .
          whatran --version
          python3 -c "import whatran as w; w.check_label('Detect peaks')"

      - name: Manifests are valid JSON
        run: |
          for f in .claude-plugin/marketplace.json .agents/plugins/marketplace.json \
                   plugins/whatran/.claude-plugin/plugin.json plugins/whatran/.codex-plugin/plugin.json \
                   plugins/whatran/hooks/hooks.json plugins/whatran/schema/analysis-graph.schema.json; do
            python3 -c "import json,sys; json.load(open(sys.argv[1]))" "$f"
          done

      - name: Record, package and check the recorded example from scratch
        working-directory: examples/recorded-demo
        run: |
          bash make_demo.sh
          python3 analysis/whatran.py verify
          test -s analysis/graph.json
          test -s analysis/index.html
          test -s whatran.json
          test -s run.sh
          test -s site/index.html

      - name: Reproduce the standard-library example
        working-directory: examples/pipeline-demo
        run: |
          mv results "$RUNNER_TEMP/pipeline-results"
          bash run.sh
          python3 check.py results "$RUNNER_TEMP/pipeline-results"
          python3 build_site.py

      - name: Reproduce the multi-analysis example
        working-directory: examples/multi-analysis-demo
        run: |
          set -euo pipefail
          for manifest in analyses/*/whatran.json; do
            analysis="${manifest%/whatran.json}"
            slug="${analysis##*/}"
            (
              cd "$analysis"
              mv results "$RUNNER_TEMP/$slug-results"
              bash run.sh
              python3 check.py results "$RUNNER_TEMP/$slug-results"
            )
          done
          python3 build_index.py

      - name: Reproduce the two-path analysis
        working-directory: examples/cancer-classification
        env:
          PYTHON: python3.11
        run: |
          mv results "$RUNNER_TEMP/cancer-results"
          bash run.sh
          python3 check.py results "$RUNNER_TEMP/cancer-results"
          python3 build_site.py

      - name: Assemble product site
        run: |
          mkdir -p "$RUNNER_TEMP/whatran-pages/example" "$RUNNER_TEMP/whatran-pages/graph"
          cp pages/index.html "$RUNNER_TEMP/whatran-pages/index.html"
          cp -R examples/cancer-classification/site/. "$RUNNER_TEMP/whatran-pages/example/"
          cp examples/recorded-demo/analysis/index.html examples/recorded-demo/analysis/graph.json "$RUNNER_TEMP/whatran-pages/graph/"
          test -s "$RUNNER_TEMP/whatran-pages/index.html"
          test -s "$RUNNER_TEMP/whatran-pages/example/index.html"
          test -s "$RUNNER_TEMP/whatran-pages/example/roc_comparison.svg"
          test -s "$RUNNER_TEMP/whatran-pages/example/model_drivers.svg"
          test -s "$RUNNER_TEMP/whatran-pages/graph/graph.json"
          grep -Fq 'href="./example/"' "$RUNNER_TEMP/whatran-pages/index.html"
          grep -Fq 'href="./graph/"' "$RUNNER_TEMP/whatran-pages/index.html"
          grep -Fq '<details class=' "$RUNNER_TEMP/whatran-pages/example/index.html"
          python3 -c 'import json; g=json.load(open("examples/recorded-demo/analysis/graph.json")); s=g["summary"]; assert s["runs"]["observed"]==s["runs"]["total"]==4 and s["claims"]["total"]==2 and s["runs"]["rejected"]==1 and s["runs"]["replay_verified"]==3, s'
          for auc in $(python3 -c 'import json; d=json.load(open("examples/cancer-classification/results/comparison.json")); print(*(format(d["paths"][k]["roc_auc"], ".3f") for k in ("logistic_regression", "random_forest")))'); do
            grep -Fq "$auc" "$RUNNER_TEMP/whatran-pages/example/index.html"
          done

      - name: Configure GitHub Pages
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/configure-pages@v5

      - name: Upload showcase
        if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
        uses: actions/upload-pages-artifact@v4
        with:
          path: ${{ runner.temp }}/whatran-pages

  deploy-pages:
    if: github.ref == 'refs/heads/main' && github.event_name != 'pull_request'
    needs: test
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Deploy showcase
        id: deployment
        uses: actions/deploy-pages@v4
